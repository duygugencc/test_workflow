# This is a basic workflow to help you get started with Actions

name: Auto sync to UAT on Push to Master

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write       # Required to push to UAT
  statuses: write       # Required to set required status check

concurrency:
  group: uat-sync       # Ensures only one sync runs at a time
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}         
      GH_TOKEN: ${{ secrets.GH_TEST_TOKEN }}  

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Set UAT sync status check to PENDING (lock UAT merge queue)
        run: |
          gh api repos/${GH_REPO}/statuses/${{ github.sha }} \
            -f state=pending \
            -f context="uat-sync-status" \
            -f description="UAT is syncing from Prod. Merges temporarily locked."
      
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name  "git-actions-uat"
          git config user.email "git-actions-uat@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TEST_TOKEN}@github.com/${GH_REPO}.git"
      
      - name: Update UAT branch from master
        run: |
          git fetch origin
          git checkout uat
          git reset --hard origin/main
          git push origin uat --force
      
      - name: Mark UAT sync status check as SUCCESS (unlock merge-queue)
        if: always()  # Runs even if previous steps fail
        run: |
          gh api repos/${GH_REPO}/statuses/${{ github.sha }} \
            -f state=success \
            -f context="uat-sync-status" \
            -f description="UAT successfully synced with Prod."

